<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fafafa;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e1e8ed;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #00a6d6;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      color: #0c2340;
    }
    .status {
      font-size: 12px;
      color: #28a745;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #28a745;
    }
    .info {
      font-size: 11px;
      color: #666;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      display: block;
      box-sizing: border-box;
      padding: 6px 10px;
      font-size: 12px;
      text-align: center;
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #e6e6e6;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">W</div>
    <div class="title">WebLab Enhancer</div>
  </div>
  <div class="status">
    <div class="dot"></div>
    <span>Active on weblab.tudelft.nl</span>
  </div>
  <div class="info">
    Organizes your active courses at the top of WebLab. Click [✕] on any course on the dashboard to deselect it.
  </div>
  <a href="https://weblab.tudelft.nl/" target="_blank" class="btn">Open WebLab</a>
</body>
</html>
